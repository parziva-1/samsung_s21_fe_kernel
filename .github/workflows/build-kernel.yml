name: Build Lightning Kernel (S21 FE r9s, Docker-enabled)

# ESTRATEGIA INCREMENTAL INVERSA: el defconfig base es el de c1a65bcc (kernel que SI BUTEA,
# sin configs Docker). Cada variante de la MATRIX AnADE configs sobre ese base bueno, para
# bisecar cual rompe el boot. Compila en paralelo. Empaqueta AnyKernel3 + sube artifact.

on:
  workflow_dispatch:
  push:
    branches: [local]
    paths:
      - 'arch/arm64/configs/exynos2100-r9sxxx_defconfig'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          # CULPABLES CONFIRMADOS: SYSVIPC/IPC_NS (run 27100163433) y CGROUP_DEVICE+CGROUP_PIDS juntos
          # (run 27101600325: D1=PID_NS+DEVICE+PIDS BOOTLOOP, P1a=PID_NS solo BUTEA). Base = PID_NS.
          # Tanda E: aislar device vs pids (¿uno solo butea?) y maximizar features que SI pueden botar.
          - name: E-dev             # ¿CGROUP_DEVICE solo butea? (-> --device, acceso /dev en contenedores)
            enable: "PID_NS CGROUP_DEVICE"
          - name: E-pids            # ¿CGROUP_PIDS solo butea? (-> --pids-limit)
            enable: "PID_NS CGROUP_PIDS"
          - name: E-net             # netfilter bridge -> red propia de contenedores (no --net=host)
            enable: "PID_NS BRIDGE_NETFILTER NETFILTER_FAMILY_BRIDGE BRIDGE_NF_EBTABLES NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_IPVS NF_CONNTRACK_BRIDGE"
          - name: E-sched           # CFS_BANDWIDTH + throttling -> limites --cpus / --io (warnings de docker info)
            enable: "PID_NS FAIR_GROUP_SCHED CFS_BANDWIDTH BLK_DEV_THROTTLING"
          - name: E-userns          # USER_NS solo (rootless / userns-remap)
            enable: "PID_NS USER_NS"
          - name: E-best            # net + sched + userns + mqueue = kernel optimo (sin device/pids/ipc)
            enable: "PID_NS BRIDGE_NETFILTER NETFILTER_FAMILY_BRIDGE BRIDGE_NF_EBTABLES NETFILTER_XT_MATCH_ADDRTYPE NETFILTER_XT_MATCH_IPVS FAIR_GROUP_SCHED CFS_BANDWIDTH BLK_DEV_THROTTLING USER_NS POSIX_MQUEUE"
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Checkout del kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Habilitar configs sobre el base bueno (variante ${{ matrix.variant.name }})
        run: |
          DEF=arch/arm64/configs/exynos2100-r9sxxx_defconfig
          enable_cfg() {
            c="$1"
            if grep -q "^# CONFIG_${c} is not set" "$DEF"; then
              sed -i "s/^# CONFIG_${c} is not set\$/CONFIG_${c}=y/" "$DEF"
            elif ! grep -q "^CONFIG_${c}=y" "$DEF"; then
              echo "CONFIG_${c}=y" >> "$DEF"
            fi
          }
          for c in ${{ matrix.variant.enable }}; do echo "habilitando CONFIG_$c"; enable_cfg "$c"; done
          echo "=== configs anadidos ==="
          for c in ${{ matrix.variant.enable }}; do grep -E "CONFIG_${c}\b" "$DEF" || echo "CONFIG_${c}: kconfig lo resolvera por deps"; done

      - name: Instalar dependencias de build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc build-essential zip unzip curl git wget libssl-dev rsync \
            flex bison cpio libncurses-dev python3 python-is-python3 \
            lsb-release dos2unix lz4 ccache

      - name: Clonar toolchains (clang r383902 + gcc 4.9 + AnyKernel3)
        run: |
          git clone --depth=1 --branch android-11.0.0_r48 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-linux-android-4.9
          git clone --depth=1 \
            https://github.com/prorooter007/android_prebuilts_clang_host_linux-x86_clang-6877366 clang-r383902
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

      - name: Compilar kernel
        run: |
          export ARCH=arm64
          export PLATFORM_VERSION=11
          export ANDROID_MAJOR_VERSION=r
          export SEC_BUILD_CONF_VENDOR_BUILD_OS=13
          export CROSS_COMPILE="$(pwd)/aarch64-linux-android-4.9/bin/aarch64-linux-android-"
          export CLANG_TRIPLE="$(pwd)/clang-r383902/bin/aarch64-linux-gnu-"
          export CLANG_PREBUILT_BIN="$(pwd)/clang-r383902/bin"
          export LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN="$(pwd)/aarch64-linux-android-4.9/bin"
          export PATH="$CLANG_PREBUILT_BIN:$LINUX_GCC_CROSS_COMPILE_PREBUILTS_BIN:$PATH"
          export LLVM=1
          make -j"$(nproc)" -C "$(pwd)" exynos2100-r9sxxx_defconfig
          make -j"$(nproc)" -C "$(pwd)" KCFLAGS="-Wno-error"

      - name: Verificar configs en el .config generado
        run: |
          echo "===== .config efectivo (variante ${{ matrix.variant.name }}) ====="
          for c in NAMESPACES UTS_NS NET_NS PID_NS IPC_NS SYSVIPC USER_NS CGROUPS \
                   CGROUP_DEVICE CGROUP_PIDS OVERLAY_FS VETH NF_NAT POSIX_MQUEUE; do
            grep -E "^(CONFIG_${c}=|# CONFIG_${c} )" .config || echo "CONFIG_${c} AUSENTE"
          done
          # El base bueno SIEMPRE debe tener estos (si faltan, algo se rompio)
          for must in NET_NS NAMESPACES OVERLAY_FS VETH CGROUPS; do
            grep -q "^CONFIG_${must}=y" .config || { echo "ERROR: falta CONFIG_${must}"; exit 1; }
          done
          echo "OK"

      - name: Generar dtb / dtbo
        run: |
          chmod +x tools/mkdtimg
          mkdir -p out
          DTB_DIR="$(pwd)/arch/arm64/boot/dts"
          tools/mkdtimg cfg_create out/dtb.img  dt.configs/exynos2100.cfg -d "${DTB_DIR}/exynos"
          tools/mkdtimg cfg_create out/dtbo.img dt.configs/r9s.cfg       -d "${DTB_DIR}/samsung/r9s"

      - name: Empaquetar con AnyKernel3
        run: |
          cp arch/arm64/boot/Image AnyKernel3/zImage
          cp out/dtbo.img AnyKernel3/dtbo.img
          cd AnyKernel3
          sed -i "s/ExampleKernel by osm0sis/exynos2100-r9sxxx Lightning ${{ matrix.variant.name }} by parziva-1/g" anykernel.sh
          sed -i "s/=maguro/=r9s/g" anykernel.sh
          sed -i "s/=toroplus/=/g; s/=toro/=/g; s/=tuna/=/g" anykernel.sh
          sed -i "s#platform/omap/omap_hsmmc.0/by-name/boot#bootdevice/by-name/boot#g" anykernel.sh
          sed -i "s/backup_file/#backup_file/g; s/replace_string/#replace_string/g; s/insert_line/#insert_line/g; s/append_file/#append_file/g; s/patch_fstab/#patch_fstab/g" anykernel.sh
          zip -r9 "../Lightning-Docker-r9s-${{ matrix.variant.name }}.zip" * -x .git README.md '*placeholder'

      - name: Subir kernel flasheable (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Lightning-Docker-r9s-${{ matrix.variant.name }}
          path: Lightning-Docker-r9s-${{ matrix.variant.name }}.zip
          if-no-files-found: error
